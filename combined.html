function summary(){let t=totals();return `<h2 style="font-size:27px">Order summary</h2><div class="total-row"><span>Subtotal</span><strong>${money(t.subtotal)}</strong></div><div class="total-row"><span>Discount</span><span>− ${money(t.discount)}</span></div><div class="total-row"><span>Delivery</span><span>Confirmed in live checkout</span></div><hr style="border:0;border-top:1px solid var(--line)"><div class="total-row"><strong>Preview total</strong><strong>${money(t.total)}</strong></div><p class="muted" style="font-size:13px">Product prices come from the supplied WooCommerce export. Tax and shipping configuration will be confirmed during integration.</p>`}
function cartPage(){let data=cartItems();return `<div class="wrap">${heading('Your shopping bag',data.length?'Good style starts here.':'Your next favourite is waiting.')}<div class="notice">Shopping preview · bag saved on this device. No real order or payment is created.</div>${!data.length?`<div class="empty"><h2>A little room for something you love.</h2><p>Explore the collection and find your fit.</p><a class="button primary" href="/shop/">Start exploring</a></div>`:`<div class="split content"><div>${data.map(x=>`<div class="cart-row">${img(x.p)}<div><a href="/product/${x.p.slug}/"><strong>${esc(x.p.name)}</strong></a><p class="muted">Size: ${esc(x.v.size)} · ${money(x.v.price)}</p><div class="quantity"><button data-qty="${x.variantId}" data-change="-1" aria-label="Decrease quantity">−</button><span>${x.qty}</span><button data-qty="${x.variantId}" data-change="1" aria-label="Increase quantity">+</button><button data-remove="${x.variantId}">Remove</button></div></div><div>${money(x.v.price*x.qty)}</div></div>`).join('')}<a class="text-link" href="/shop/">Continue shopping</a></div><div class="panel">${summary()}<form id="coupon-form" class="searchbar"><input class="search-input" name="coupon" placeholder="SAVE100 or STYLE300" aria-label="Coupon code"><button>Apply</button></form><a class="button primary" style="width:100%" href="/checkout/">Continue to checkout</a></div></div>`}</div>`}
function checkout(){if(!cartItems().length)return `<div class="wrap">${heading('Checkout')}<div class="empty"><h2>Your bag is empty.</h2><a class="button primary" href="/shop/">Browse products</a></div></div>`;return `<div class="wrap">${heading('Checkout','Your fit. Your details. One clear checkout.')}<div class="notice">Demo checkout only. No payment is collected, and no live WooCommerce order is placed.</div><div class="split content"><form id="checkout-form" class="stack"><div class="panel"><h2 style="font-size:27px">Delivery details</h2><div class="form-grid">${field('First name','first','text',true)}${field('Last name','last','text',true)}${field('Email','email','email',true)}${field('Mobile number','phone','tel',true,'pattern="[6-9][0-9]{9}" title="Enter a 10-digit Indian mobile number"')}${field('Street address','address','text',true,'class="full"')}${field('Apartment / landmark','landmark')}${field('City','city','text',true)}${field('State','state','text',true)}${field('PIN code','pin','text',true,'pattern="[1-9][0-9]{5}" title="Enter a six-digit Indian PIN code"')}<label class="field full">Order notes<textarea name="notes" placeholder="Anything you would like us to know?"></textarea></label></div></div><div class="panel"><h2 style="font-size:27px">Payment preview</h2><label><input type="radio" name="payment" value="cod" checked> Cash on delivery — preview</label><p class="muted">Online payment options will be supplied by the connected WooCommerce gateway.</p><label style="font-size:14px"><input type="checkbox" required> I understand this is a demo order and accept the <a class="text-link" href="/terms-and-conditions/">preview terms</a>.</label></div><button class="primary">Place demo order</button></form><div class="panel" style="align-self:start">${cartItems().map(x=>`<div class="total-row"><span>${esc(x.p.name)}<br><small>${esc(x.v.size)} × ${x.qty}</small></span><strong>${money(x.v.price*x.qty)}</strong></div>`).join('')}${summary()}</div></div></div>`}
function field(label,name,type='text',required=false,extra=''){let full=extra.includes('class="full"');return `<label class="field ${full?'full':''}">${label}${required?' *':''}<input name="${name}" type="${type}" ${required?'required':''} ${extra.replace('class="full"','')} autocomplete="${name==='email'?'email':name==='phone'?'tel':'off'}"></label>`}
function reviewList(id){let r=reviews.filter(r=>!id||r.product===id);return r.length?r.map(r=>`<div class="review"><strong>${esc(r.name)}</strong> · ${'★'.repeat(r.rating)}<p>${esc(r.text)}</p><small>Preview review · unverified · stored on this device</small></div>`).join(''):'<p>No published reviews are available for this preview. Share your feedback below.</p>'}
function reviewPage(){const product=new URLSearchParams(routeLocation.search).get('product')||'';return `<div class="wrap">${heading('Customer reviews','Your experience helps other shoppers find their fit.')}<div class="notice">Preview reviews are unverified and saved only on this device. Live reviews will require WordPress moderation.</div><div class="split content"><div>${reviewList()}</div><form id="review-form" class="panel stack"><h2 style="font-size:28px">Share your experience</h2>${field('Your name','name','text',true)}<label class="field">Product<select name="product" required><option value="">Choose a product</option>${products.map(p=>`<option value="${p.id}" ${p.id===product?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Rating<select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} stars</option>`).join('')}</select></label><label class="field">Your review<textarea name="text" required minlength="10" maxlength="2000"></textarea></label><button class="primary">Save preview review</button></form></div></div>`}
const faqData=[['How do I choose the right size?','Use the available sizes on each product page. Compare measurements with a garment that fits you comfortably, and contact our fit team before ordering if you are unsure.'],['What sizes are available?','Sizes vary by product. Many styles in the supplied catalogue offer 2XL to 8XL; the product page shows the exact available variations.'],['Are women’s products available?','Women’s categories are prepared in this preview. The supplied inventory contains men’s products only, so no women’s items are listed for sale.'],['How long does delivery take?','Delivery depends on location and product availability. The supplied checkout mentions standard delivery within 7–8 days; the support team should confirm the estimate before a live order.'],['How do returns and exchanges work?','Contact support with your order details. Eligibility, deadlines and garment-condition requirements must be confirmed under the final store policy.'],['Can I pay by Cash on Delivery?','This preview demonstrates the COD selection. Actual COD availability depends on the delivery PIN code and the live WooCommerce configuration.'],['Can I track an order?','Demo orders can be viewed under My Account on the same device. Real order tracking will be connected to WooCommerce and the shipping provider.'],['How can I contact Beyond?','Call or WhatsApp +91 8318595521, or email Support@beyondplussize.in.'],['Do you have a physical location?','The supplied store address is Budheshwar, Lucknow, Uttar Pradesh 226017. Contact the team to confirm visit timings.'],['Can I use a coupon?','The preview supports SAVE100 for a subtotal of ₹1,299 or more and STYLE300 for ₹2,499 or more. Final offers depend on the live store rules.']];

function contact(){return `<div class="wrap">${heading('A real person. A little help.','Questions about fit, fabric or your order? We would love to hear from you.')}<div class="split content"><div><div class="eyebrow">HERE FOR YOU</div><h2>Let's find your perfect fit.</h2><p>Our Lucknow team can help you choose a style, check sizing or discuss delivery and returns.</p><div class="panel"><h3>Chat, call or write</h3><p><a class="text-link" href="https://wa.me/918318595521">WhatsApp +91 8318595521</a></p><p><a href="tel:+918318595521">Call +91 8318595521</a></p><p><a href="mailto:Support@beyondplussize.in">Support@beyondplussize.in</a></p><p>Budheshwar, Lucknow<br>Uttar Pradesh 226017, India</p></div></div><form id="contact-form" class="panel stack"><h2 style="font-size:28px">Send a message</h2><div class="notice">Form design preview. Your message will be prepared as an email; it is not submitted to a server.</div><div class="form-grid">${field('Your name','name','text',true)}${field('Email address','email','email',true)}${field('Phone number','phone','tel')}${field('Order number (optional)','order')}<label class="field full">How can we help?<select name="topic"><option>Size & fit guidance</option><option>Order enquiry</option><option>Returns & exchange</option><option>Women’s collection</option><option>Other</option></select></label><label class="field full">Message<textarea name="message" required minlength="10"></textarea></label><label class="full"><input type="checkbox" required> I agree to the <a class="text-link" href="/privacy-policy/">privacy policy</a>.</label></div><button class="primary">Prepare email message</button></form></div></div>`}
function sizeGuide(){return `<div class="wrap">${heading('Find your fit. Feel your best.','A thoughtful fit starts with a few simple measurements.')}<div class="split content"><div><h2>Measure a favourite garment.</h2><p>Lay a well-fitting garment flat, smooth out the fabric and measure without stretching. Compare with the specific style before ordering.</p>${[['Chest','Measure across the garment beneath the armholes. Double the flat measurement for circumference.'],['Waist','Measure around the point where your trousers normally sit, keeping the tape comfortably level.'],['Length','Measure from the highest shoulder point to the hem for topwear.'],['Comfort allowance','Consider whether you prefer a closer or more relaxed fit. Fabric stretch and cut can change the feel.']].map(([t,d])=>`<details open><summary>${t}</summary><p>${d}</p></details>`).join('')}</div><div class="panel"><h2 style="font-size:28px">Sizes are style-specific.</h2><p>The CSV includes size labels, but no garment measurement chart. We have kept those labels and have not invented chest or waist measurements.</p><div class="table-wrap"><table><thead><tr><th>Collection</th><th>Check before ordering</th></tr></thead><tbody>${categories.map(c=>`<tr><td>${c}</td><td>Available size variations on the product page</td></tr>`).join('')}</tbody></table></div><a class="button primary" href="https://wa.me/918318595521">Ask for measurements</a></div></div></div>`}
function about(){return `<div class="wrap">${heading('Beyond size. Beyond expectations.','Style should feel personal. Comfort should come naturally.')}<div class="split content"><div>${img(products[1],'product-detail-image')}</div><div><div class="eyebrow">OUR STORY</div><h2>A wardrobe with room for you.</h2><p>Beyond The Plus Size Store is built around a simple idea: people deserve clothing that supports their confidence and feels comfortable in everyday life.</p><p>Our collection brings together shirts, T-shirts, trousers, winter layers and ethnic wear, with product-specific size options. From a workday outfit to a relaxed weekend look, the aim is a better fit without giving up your personal style.</p><h2 style="font-size:28px;margin-top:30px">Rooted in Lucknow.</h2><p>Our supplied store address is Budheshwar, Lucknow, Uttar Pradesh. We welcome conversations about fit, fabric and what you would like to see next.</p><a class="button primary" href="/shop/">Discover the collection</a><p><a class="text-link" href="/contact/">Get to know our team</a></p></div></div></div>`}
const articles=[{slug:'how-to-find-your-plus-size-shirt-fit',title:'A better shirt starts with a better fit.',intro:'How to choose a shirt that feels as good as it looks.',sections:[['Start with the shoulders','The shoulder seam should sit comfortably. Move your arms forward and check that the fabric does not pull across your upper back.'],['Give yourself breathing room','Sit down, reach forward and button the shirt fully. A comfortable shirt should let you move without pulling at the buttons.'],['Check the actual measurements','Size labels vary across styles. Ask for garment measurements and compare them with a shirt that you already love.']]},{slug:'cotton-clothing-for-indian-summers',title:'Everyday cotton, thoughtfully chosen.',intro:'A simple guide to breathable clothing and easy care.',sections:[['Consider the fabric and weave','Cotton garments vary in weight and finish. Choose a texture and feel that suits your daily routine, and check the product description.'],['Care makes a difference','Follow the garment’s care label. Wash similar colours together, avoid excessive heat and let clothes dry in a ventilated space.'],['Make comfort your starting point','A relaxed silhouette can make everyday movement easier. Balance your preferred fit with the character of the fabric.']]},{slug:'build-a-versatile-plus-size-wardrobe',title:'Less guesswork. More great outfits.',intro:'Build a wardrobe around pieces you enjoy wearing.',sections:[['Begin with your week','Think about the clothes you actually need for work, travel, evenings and downtime. Start with versatile shirts, comfortable trousers and casual tees.'],['Find a palette that feels like you','Choose colours you like wearing. Prints and textures can bring variety without changing your entire wardrobe.'],['Add one considered layer','A jacket or waistcoat can change the feel of an outfit. Check the size and room for layering before choosing.']]}];

const policies={'shipping-policy':{title:'Shipping policy',sections:[['Shipping across India','Shipping availability, charges and delivery estimates depend on the product and destination PIN code. Contact the Beyond support team for confirmation.'],['Delivery estimates','The supplied checkout mentions standard delivery within 7–8 days. This is an estimate to confirm with the store, rather than a guaranteed delivery window.'],['Tracking and assistance','For live orders, tracking information should be provided once the order ships. Contact +91 8318595521 with your order number for assistance.'],['Preview configuration','This preview does not create shipments. Final shipping zones, rates, free-shipping thresholds and taxes must be configured in WooCommerce.']]},'return-policy':{title:'Returns & exchanges',sections:[['Request support','Contact Support@beyondplussize.in or WhatsApp +91 8318595521 with your order number, product details and the reason for your request.'],['Eligibility','Return deadlines, eligible products, garment-condition requirements and shipping charges require store confirmation before launch. No unconfirmed universal return promise is made in this preview.'],['Wrong or damaged item','Contact the team promptly with relevant photographs and order details so they can review the issue.'],['Refunds','Refund approval, method and timing depend on the confirmed store policy and payment provider. This demo does not process refunds.']]},'privacy-policy':{title:'Privacy policy',sections:[['About this preview','The preview keeps your shopping bag, wishlist, demo orders and unverified reviews in browser storage on this device. These records are not sent to a store database.'],['Contact details','The contact form prepares an email in your email application. You decide whether to send it. Do not include payment credentials or sensitive personal information.'],['Browser storage','You can remove preview data from My Account or by clearing this site’s browser storage.'],['Live store requirements','The final WordPress store must provide a reviewed privacy notice covering its actual data collection, processors, retention, cookies and customer rights. Contact Support@beyondplussize.in for store enquiries.']]},'terms-and-conditions':{title:'Terms & conditions',sections:[['Design preview','This website is a shopping design preview based on the supplied Beyond materials. It does not establish a live purchase contract, collect payment or create real orders.'],['Products and prices','Product names, variations and prices are drawn from the supplied WooCommerce export. Availability and final pricing must be checked against the live store.'],['Orders and payments','Demo orders are saved on the current device. Live payment methods, tax, shipping and order processing will be provided through WooCommerce.'],['Before launch','Final sale terms, returns, privacy and shipping policies need store review and confirmation before customer transactions are enabled.']]}};
function policy(k){let p=policies[k];return `<div class="wrap content"><article class="article">${heading(p.title,'Store information and preview conditions.')}<div class="notice">Policy draft for review before the live WordPress store launches.</div>${p.sections.map(([t,d])=>`<h2>${t}</h2><p>${d}</p>`).join('')}<p><a class="text-link" href="/contact/">Contact Beyond support</a></p></article></div>`}
function account(){let orders=JSON.parse(localStorage.getItem('beyond-orders')||'[]');return `<div class="wrap">${heading('My account','Your preview orders, in one place.')}<div class="notice">Device-local preview account. This is not a registered WordPress account and has no password or live order access.</div><div class="split content"><div><h2 style="font-size:28px">Demo order history</h2>${orders.length?orders.map(o=>`<div class="panel" style="margin-bottom:15px"><strong>${esc(o.id)}</strong><p>${esc(new Date(o.date).toLocaleDateString('en-IN'))} · Demo order · ${money(o.total)}</p>${o.items.map(x=>`<p>${esc(x.name)} · ${esc(x.size)} × ${x.qty}</p>`).join('')}</div>`).join(''):'<div class="empty"><p>No demo orders yet.</p><a class="button primary" href="/shop/">Explore the collection</a></div>'}</div><div class="panel stack"><h2 style="font-size:28px">Your shopping tools</h2><a class="button" href="/wishlist/">View wishlist</a><a class="button" href="/cart/">View shopping bag</a><a class="button" href="/contact/">Contact support</a><button id="clear-data">Clear preview data from this device</button><p class="muted">Live login, registration, password reset and order tracking will use WooCommerce My Account.</p></div></div></div>`}

function render(){let path=routeLocation.pathname.replace(/\/$/,'')||'/',body,title;filters={category:'',size:'',max:10000,sort:'featured',q:''};page=1;currentProduct=null;if(path==='/'){body=home();title='Home'}else if(path==='/shop'||path==='/men'){title=path==='/men'?"Men's collection":'Shop all';body=shop(title)}else if(path.startsWith('/product-category/')){let c=categories.find(c=>catSlug(c)===path.split('/')[2]);title=c||'Shop all';body=shop(title,c)}else if(path.startsWith('/women')){title=path==='/women'?"Women's collection":'Women · '+path.split('/')[2].replaceAll('-',' ');body=women(title)}else if(path.startsWith('/product/')){let p=products.find(p=>p.slug===path.split('/')[2]);if(p){body=productPage(p);title=p.name}else{title='Product not found';body=notFound()}}else{title={'/cart':'Your shopping bag','/checkout':'Checkout','/account':'My account','/search':'Search','/wishlist':'Wishlist','/reviews':'Customer reviews','/about':'Our story','/contact':'Contact','/faq':'FAQ','/size-guide':'Size guide','/blog':'The Beyond journal'}[path];if(path==='/cart')body=cartPage();else if(path==='/checkout')body=checkout();else if(path==='/account')body=account();else if(path==='/search')body=search();else if(path==='/wishlist')body=wishlistPage();else if(path==='/reviews')body=reviewPage();else if(path==='/about')body=about();else if(path==='/contact')body=contact();else if(path==='/faq')body=faq();else if(path==='/size-guide')body=sizeGuide();else if(path.startsWith('/blog')){body=blog(path.split('/')[2]);title=articles.find(a=>a.slug===path.split('/')[2])?.title||'The Beyond journal'}else if(policies[path.slice(1)]){body=policy(path.slice(1));title=policies[path.slice(1)].title}else{body=notFound();title='Page not found'}}$('#app').innerHTML=header()+`<main id="main">${body}</main>`+footer(title);document.title=title+' | Beyond Plus Size';let desc=seoCopy(title);$('meta[name=description]').content=desc;$('meta[property="og:title"]').content=document.title;$('meta[property="og:description"]').content=desc;$('meta[property="og:url"]').content=routeLocation.origin+routeLocation.pathname;$('link[rel=canonical]').href=routeLocation.origin+routeLocation.pathname;updateSchema(title);if($('#results'))updateResults();if($('#search-results'))searchResults();}

function updateSchema(title){let data={"@context":"https://schema.org","@type":"WebPage",name:title,url:routeLocation.origin+routeLocation.pathname,description:seoCopy(title)};if(currentProduct)data={...data,"@type":"Product",name:currentProduct.name,description:currentProduct.description,image:currentProduct.images,sku:currentProduct.id,brand:{"@type":"Brand",name:'Beyond The Plus Size Store'}};$('#schema').textContent=JSON.stringify(data)}

document.addEventListener('click',e=>{let a=e.target.closest('a');if(a&&a.origin===routeLocation.origin&&!a.hash){e.preventDefault();routeHistory.pushState({},'',a.href);render();scrollTo(0,0);return}let b=e.target.closest('button');if(!b)return;if(b.id==='menu-toggle'){let open=$('#mobile-nav').classList.toggle('open');b.setAttribute('aria-expanded',open);return}if(b.dataset.wish){let id=b.dataset.wish;wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];save();toast(wishlist.includes(id)?'Saved to your wishlist.':'Removed from your wishlist.');if(routeLocation.pathname.startsWith('/wishlist'))render();else{document.querySelectorAll(`[data-wish="${id}"]`).forEach(x=>{if(x.classList.contains('wish')){x.classList.toggle('selected',wishlist.includes(id));x.textContent=wishlist.includes(id)?'♥':'♡'}else x.textContent=wishlist.includes(id)?'Saved to wishlist':'Save to wishlist'})}return}if(b.dataset.page){page=Number(b.dataset.page);updateResults();$('#results').scrollIntoView({behavior:'smooth',block:'start'});return}if(b.dataset.variant){selectedVariant=currentProduct.variants.find(v=>v.id===b.dataset.variant);document.querySelectorAll('[data-variant]').forEach(x=>x.classList.toggle('chosen',x===b));$('#selected-size').textContent=selectedVariant.size;$('#variant-price').innerHTML=money(selectedVariant.price)+(selectedVariant.regular>selectedVariant.price?`<del>${money(selectedVariant.regular)}</del>`:'');return}if(b.dataset.image){$('.product-detail-image').src=b.dataset.image;return}if(b.id==='add-cart')addCart();if(b.id==='buy-now'&&addCart()){routeHistory.pushState({},'','/checkout/');render();scrollTo(0,0)}if(b.dataset.qty){let item=cart.find(x=>x.variantId===b.dataset.qty);item.qty=Math.min(10,Math.max(1,item.qty+Number(b.dataset.change)));save();render()}if(b.dataset.remove){cart=cart.filter(x=>x.variantId!==b.dataset.remove);save();render()}if(b.id==='clear-data'){['beyond-cart','beyond-wishlist','beyond-orders','beyond-reviews'].forEach(k=>localStorage.removeItem(k));cart=[];wishlist=[];reviews=[];render();toast('Preview data cleared.')}});

op/">Continue exploring</a></div></div>`;scrollTo(0,0)}});

utton><span class="slide-count">01 / 03</span></div></div><div class="trust"><div><span>✓</span> Fits designed around you</div><div><span>◇</span> Considered fabric choices</div><div><span>↔</span> Product-specific sizes</div><div><span>♡</span> Real people. Personal help.</div></div><div class="wrap"><section class="size-strip reveal"><div><div class="eyebrow">YOUR SIZE. YOUR STYLE.</div><h2>Start with your fit.</h2></div><div class="size-links">${['2XL','3XL','4XL','5XL','6XL','7XL','8XL'].map(s=>`<a href="/shop/?size=${s}">${s}</a>`).join('')}<a class="size-guide-link" href="/fit-profile/">Find my fit</a></div></section>${productSection('Fresh perspective. Effortless style.','The latest catalogue edit. Pick something that feels like you.',curated('new'),'/new-arrivals/','NEW ARRIVALS',4)}<section class="reveal campaign-duo"><div class="campaign-men"><div class="campaign-image">${img(products.find(p=>p.category==='Shirts'))}</div><div class="campaign-copy"><div class="eyebrow">THE MEN’S COLLECTION</div><h2>Made for<br>your everyday.</h2><a class="button" href="/men/">Discover menswear</a></div></div><div class="campaign-women"><div class="eyebrow">THE NEXT CHAPTER</div><h2>Women.<br>Style on<br>your terms.</h2><p>Thoughtful collections are on their way. Tell us what you would love to wear.</p><a class="button primary" href="/women/">Explore women's categories</a><span class="campaign-note">Women's inventory coming to the catalogue</span></div></section>${productSection('A little texture. A lot of character.','Prints and considered details for the way you dress.',curated('trend'),'/collections/','TRENDING STYLE EDIT',4)}<section class="reveal"><div class="section-head"><div><div class="eyebrow">EXPLORE YOUR WARDROBE</div><h2>Good style, from the ground up.</h2></div><a class="text-link" href="/shop/">Shop every category</a></div><div class="category-carousel">${categories.map(c=>{const p=products.find(p=>p.category===c);return `<a class="category-tile" href="/product-category/${catSlug(c)}/">${img(p)}<div><h3>${c}</h3><span>${products.filter(p=>p.category===c).length} styles</span></div></a>`}).join('')}</div></section>${productSection('The pieces you’ll keep coming back to.','Our essentials edit — selected for versatile, everyday dressing.',curated('best'),'/best-sellers/','BESTSELLERS EDIT · CURATED PREVIEW',4)}<section class="reveal store-experience"><div><div class="eyebrow">THE BEYOND STORE EXPERIENCE</div><h2>Find your fit.<br>In real life.</h2><p>Feel the fabric. Try something new. Our Lucknow stores are ready to welcome you.</p><a class="button primary" href="/stores/">Find a Beyond store</a><div class="store-mini-row">${storeData.slice(0,2).map(storeMini).join('')}</div></div><div class="map-preview"><iframe title="Wave Mall Lucknow map preview" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(storeData[0].address)}&output=embed"></iframe><a class="map-caption" href="/stores/">Wave Mall · Lucknow <span>View all stores</span></a></div></section><section class="reveal"><div class="section-head"><div><div class="eyebrow">MORE BEYOND, CLOSER TO YOU</div><h2>A new chapter is coming.</h2></div><a class="text-link" href="/stores/">Store updates</a></div><div class="coming-grid">${storeData.slice(2).map(storeMini).join('')}</div></section><section class="reveal fit-banner"><div><div class="eyebrow">FIT IS PERSONAL</div><h2>A little guidance.<br>A lot more confidence.</h2><p>Save your fit preferences and ask our team for product measurements.</p></div><div><button class="button primary" data-size-guide>What's my size?</button><a class="button" href="/fit-profile/">Create a fit profile</a></div></section><section class="reveal"><div class="section-head"><div><div class="eyebrow">FROM OUR COMMUNITY</div><h2>Good fit. Honest feedback.</h2><p>Feedback supplied from the existing Beyond website.</p></div><a class="text-link" href="/reviews/">Share your experience</a> function setSlide(i){const slides=[...document.querySelectorAll('.hero-slide')];if(!slides.length)return;slideIndex=(i+slides.length)%slides.length;slides.forEach((s,n)=>{s.classList.toggle('is-active',n===slideIndex);s.setAttribute('aria-hidden',n!==slideIndex);s.inert=n!==slideIndex});document.querySelectorAll('[data-slide-to]').forEach((b,n)=>{b.classList.toggle('active',n===slideIndex);b.setAttribute('aria-pressed',n===slideIndex)});$('.slide-count').textContent=String(slideIndex+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0')}

function quickView(id){const p=products.find(p=>p.id===id);if(!p)return;let v=p.variants.find(v=>v.stock&&v.price>0)||p.variants[0];const rating=ratingFor(p);openOverlay('A closer look',`<div class="quick-layout"><div class="quick-photos"><img id="quick-image" src="${esc(v.image||p.image)}" alt="${esc(p.name)}"><button class="quick-fullscreen" data-gallery="${p.id}">Expand image</button><div class="quick-thumbs">${(p.gallery||[p.image]).map((u,i)=>`<button data-quick-photo="${esc(u)}" aria-label="View photo ${i+1}"><img src="${esc(u)}" alt="${esc(p.name)} view ${i+1}" loading="lazy"></button>`).join('')}</div></div><div class="quick-info"><div class="eyebrow">${p.category}</div><h3>${esc(p.name)}</h3><div class="price" id="quick-price">${money(v.price)}${v.regular>v.price&&v.price>0?`<del>${money(v.regular)}</del>`:''}</div><p class="muted">${rating?'★ '+rating+' · preview reviews':'No verified reviews in this preview'}</p><p>${esc(p.short||p.description).slice(0,260)}</p><div class="quick-color"><span>Colour: ${esc(p.color)}</span><small>Identified from product title</small></div><div class="purchase-size-label"><strong>Select ${esc(p.sizeAttribute||'size')}</strong><button class="inline-link" data-size-guide>Size help</button></div><div class="options">${p.variants.map(v=>`<button data-quick-variant="${v.id}" class="${v.id===quickDefault(p).id?'chosen':''}" ${!v.stock||!v.price?'disabled':''}>${esc(v.size)}</button>`).join('')}</div><p id="quick-stock" class="availability">${v.stock&&v.price?'Available in the supplied catalogue':'Contact for price or availability'} · SKU ${esc(v.sku||v.id)}</p><label class="quantity">Quantity <input id="quick-qty" type="number" min="1" max="10" value="1"></label><div class="quick-purchase"><button class="primary" data-add-quick ${!v.stock||!v.price?'disabled':''}>Add to bag</button><button data-buy-quick ${!v.stock||!v.price?'disabled':''}>Buy now</button></div><button class="inline-link" data-wish="${p.id}">${wishlist.includes(p.id)?'Saved to wishlist':'Save to wishlist'}</button><a class="button view-full" href="/product/${p.slug}/">View full product</a><a class="inline-link" target="_blank" rel="noopener" href="${wa('Hi Beyond, I need help with '+p.name+'. Size: '+v.size)}">Ask on WhatsApp</a></div></div>`,'quick-view');quickProduct=p;quickVariant=v;track('quick_view',{item_id:p.id})}

function updateQuickVariant(id){quickVariant=quickProduct.variants.find(v=>v.id===id);if(!quickVariant)return;document.querySelectorAll('[data-quick-variant]').forEach(b=>b.classList.toggle('chosen',b.dataset.quickVariant===id));$('#quick-price').innerHTML=money(quickVariant.price)+(quickVariant.regular>quickVariant.price?`<del>${money(quickVariant.regular)}</del>`:'');$('#quick-stock').textContent=(quickVariant.stock&&quickVariant.price?'Available in catalogue':'Contact for availability')+' · SKU '+(quickVariant.sku||id);$('#quick-image').src=quickVariant.image||quickProduct.image}
function addPreviewProduct(p,v,qty=1,buy=false){if(!v?.stock||!v.price){toast('Please ask our team about this size and price.');return}if(!Number.isInteger(qty)||qty<1||qty>10){toast('Choose a quantity between 1 and 10.');return}let x=cart.find(x=>x.variantId===v.id);if(x)x.qty=Math.min(10,x.qty+qty);else cart.push({productId:p.id,variantId:v.id,qty});save();track('add_to_cart',{item_id:p.id,variant_id:v.id,value:v.price*qty,currency:'INR'});if(buy){closeOverlay();routeHistory.pushState({},'','/checkout/');render();scrollTo(0,0)}else{openBag(`${p.name} · ${v.size} added to your bag`);toast('✓ Added to bag')}}
function openBag(message='Your favourites, ready when you are.'){const items=cartItems(),t=totals();openOverlay('Your shopping bag',`<p class="drawer-intro">${esc(message)}</p><div class="notice compact">Preview bag · prices from your WooCommerce export. No real order is placed.</div><div class="drawer-items">${items.length?items.map(x=>`<div class="drawer-item"><a href="/product/${x.p.slug}/">${img(x.p)}</a><div><a href="/product/${x.p.slug}/"><h3>${esc(x.p.name)}</h3></a><p>${esc(x.v.size)} · ${esc(x.p.color||'')}</p><strong>${money(x.v.price*x.qty)}</strong><div class="quantity"><button data-drawer-qty="${x.variantId}" data-delta="-1" aria-label="Decrease quantity">−</button><span>${x.qty}</span><button data-drawer-qty="${x.variantId}" data-delta="1" aria-label="Increase quantity">+</button><button class="inline-link" data-drawer-remove="${x.variantId}">Remove</button><button class="inline-link" data-save-later="${x.variantId}">Save for later</button></div></div></div>`).join(''):'<div class="empty"><h3>Room for something you love.</h3><a class="button primary" href="/shop/">Discover your style</a></div>'}</div>${items.length?`<form id="drawer-coupon" class="coupon-input"><input name="coupon" placeholder="Coupon code" aria-label="Coupon code"><button>Apply</button></form><div class="drawer-totals"><div class="total-row"><span>Subtotal</span><strong>${money(t.subtotal)}</strong></div>${t.discount?`<div class="total-row"><span>Discount</span><span>−${money(t.discount)}</span></div>`:''}<div class="total-row"><strong>Preview total</strong><strong>${money(t.total)}</strong></div><p class="muted">Shipping and taxes are confirmed in the live store. Free-shipping offers differ in the supplied materials.</p><a class="button primary" href="/checkout/">Continue to demo checkout</a><a class="button" href="/cart/">View shopping bag</a></div>`:''}`,'side-drawer');track('view_cart')}
function changeDrawerQty(id,delta){const x=cart.find(x=>x.variantId===id);if(!x)return;x.qty=Math.max(1,Math.min(10,x.qty+delta));save();openBag()}
function applyPreviewCoupon(code){const c=String(code).trim().toUpperCase(),subtotal=totals().subtotal;if((c==='SAVE100'&&subtotal>=1299)||(c==='STYLE300'&&subtotal>=2499)){coupon=c;return true}toast('SAVE100: subtotal ₹1,299+. STYLE300: subtotal ₹2,499+.');return false}
function openSearch(){const recent=readLocal('searches',[]);openOverlay('Find your next favourite.',`<div class="overlay-search-field"><svg viewBox="0 0 24 24">${icons.search}</svg><input id="overlay-search" type="search" placeholder="Try cotton shirts, polos or trousers" aria-label="Search Beyond products" autocomplete="off"><button data-clear-search class="inline-link">Clear</button></div><div class="search-suggestions"><div><span class="eyebrow">POPULAR SEARCHES</span><div>${['Cotton','Polo','Trousers','Printed','Jackets'].map(t=>`<button data-search-term="${t}">${t}</button>`).join('')}</div></div>${recent.length?`<div><span class="eyebrow">YOUR RECENT SEARCHES</span><div>${recent.map(t=>`<button data-search-term="${esc(t)}">${esc(t)}</button>`).join('')}<button class="inline-link" data-clear-recent>Clear history</button></div></div>`:''}</div><div id="overlay-search-count" role="status"></div><div class="search-overlay-results" id="overlay-search-results"></div>`,'search-overlay');searchOverlayResults('');track('search_open')}
function searchOverlayResults(q){let term=q.trim().toLowerCase();const matches=term?products.filter(p=>(p.name+' '+p.category+' '+p.color).toLowerCase().includes(term)):curated('best').slice(0,6);$('#overlay-search-count').textContent=term?(matches.length?matches.length+' matching styles':'No exact match. Try these styles instead.'):'A few favourites to explore';let result=matches.length?matches:curated('best').slice(0,4);$('#overlay-search-results').innerHTML=result.slice(0,12).map(p=>`<article class="search-result"><a href="/product/${p.slug}/">${img(p)}</a><div><small>${p.category}</small><a href="/product/${p.slug}/"><h3>${esc(p.name)}</h3></a><div class="price">${money(p.price)}${p.regular>p.price&&p.price>0?`<del>${money(p.regular)}</del>`:''}</div><button data-quick-add="${p.id}" class="inline-link">${available(p)?'Choose size & add':'Check availability'}</button></div></article>`).join('')+`<a class="button primary" href="/search/?q=${encodeURIComponent(q)}">View search results</a>`}
function rememberSearch(q){if(q.trim().length<2)return;writeLocal('searches',[q.trim(),...readLocal('searches',[]).filter(x=>x!==q.trim())].slice(0,6));track('search',{search_term:q.trim()})}
function openSizeGuide(){openOverlay('Your fit, thoughtfully chosen.',`<div class="size-modal-grid"><div><div class="eyebrow">A LITTLE GUIDANCE</div><h3>Measure a garment you love.</h3><p>Use a soft tape, keep the garment flat and avoid stretching the fabric.</p>${[['Chest','Measure beneath the armholes. Double the flat width for circumference.'],['Waist','Measure around where you wear your trousers. Keep the tape comfortably level.'],['Hip','Measure the fullest part while standing naturally.'],['Length','Measure from the highest shoulder point to the hem.']].map(([t,p])=>`<details open><summary>${t}</summary><p>${p}</p></details>`).join('')}</div><div class="panel"><h3>Size labels are style-specific.</h3><p>Available size variations come from the product catalogue. It does not include a measurement chart, so we won’t guess your recommended size.</p><a class="button primary" href="/fit-profile/">Save your fit profile</a><p><a class="text-link" target="_blank" rel="noopener" href="${wa('Hi Beyond, please help me choose the right size'+(currentProduct?' for '+currentProduct.name:''))}">Still unsure? Ask on WhatsApp</a></p><a class="text-link" href="/size-guide/">Read the complete size guide</a></div></div>`,'size-modal')}
function openGallery(id,index=0){const p=products.find(p=>p.id===id);if(!p)return;galleryProduct=p;galleryIndex=index;openOverlay(p.name,`<div class="gallery-toolbar"><span id="gallery-count"></span><button data-gallery-zoom>Zoom in</button><button data-gallery-prev aria-label="Previous image">‹</button><button data-gallery-next aria-label="Next image">›</button></div><div class="fullscreen-stage" id="gallery-stage"><img id="gallery-photo" alt="${esc(p.name)}"></div><div class="gallery-thumbnails">${(p.gallery||[p.image]).map((u,i)=>`<button data-gallery-index="${i}" aria-label="View image ${i+1}"><img src="${esc(u)}" alt="${esc(p.name)} view ${i+1}" loading="lazy"></button>`).join('')}</div>`,'gallery-modal');galleryProduct=p;galleryIndex=index;showGalleryImage(index);let start=0;$('#gallery-stage').addEventListener('touchstart',e=>{start=e.touches[0].clientX},{passive:true});$('#gallery-stage').addEventListener('touchend',e=>{let diff=e.changedTouches[0].clientX-start;if(Math.abs(diff)>45)showGalleryImage(galleryIndex+(diff<0?1:-1))},{passive:true});$('#gallery-photo').addEventListener('dblclick',toggleGalleryZoom)}
function showGalleryImage(i){if(!galleryProduct)return;let images=galleryProduct.gallery||[galleryProduct.image];galleryIndex=(i+images.length)%images.length;$('#gallery-photo').src=images[galleryIndex];$('#gallery-photo').classList.remove('zoomed');$('#gallery-count').textContent=(galleryIndex+1)+' / '+images.length;document.querySelectorAll('[data-gallery-index]').forEach(b=>b.classList.toggle('chosen',Number(b.dataset.galleryIndex)===galleryIndex))}
function toggleGalleryZoom(){let z=$('#gallery-photo').classList.toggle('zoomed');$('[data-gallery-zoom]').textContent=z?'Zoom out':'Zoom in'}
productPage=function(p){currentProduct=p;selectedVariant=quickDefault(p);const recent=readLocal('recent',[]);writeLocal('recent',[p.id,...recent.filter(id=>id!==p.id)].slice(0,12));const rating=ratingFor(p);return `<div class="wrap content product-content"><div class="breadcrumb"><a href="/">Home</a> / <a href="/men/">Men</a> / <a href="/product-category/${catSlug(p.category)}/">${p.category}</a></div><div class="split product-detail-layout"><div class="product-gallery"><div class="vertical-thumbnails">${(p.gallery||[p.image]).map((u,i)=>`<button data-pdp-photo="${esc(u)}" data-photo-index="${i}" class="${i===0?'chosen':''}" aria-label="Show product image ${i+1}"><img src="${esc(u)}" alt="${esc(p.name)} detail ${i+1}" loading="lazy"></button>`).join('')}</div><div class="main-product-photo"><button data-gallery="${p.id}" class="main-image-button" aria-label="Open fullscreen product gallery"><img class="product-detail-image" src="${esc(selectedVariant.image||p.image)}" alt="${esc(p.name)}"></button><button class="gallery-expand" data-gallery="${p.id}">Expand & zoom</button><div class="photo-nav"><button data-pdp-prev aria-label="Previous product image">‹</button><button data-pdp-next aria-label="Next product image">›</button></div></div></div><div class="product-details"><div class="eyebrow">BEYOND / ${p.category.toUpperCase()}</div><h1>${esc(p.name)}</h1><div class="pdp-rating">${rating?'★ '+rating+' · device-local preview reviews':'Be the first to review this style'} <a href="/reviews/?product=${p.id}" class="text-link">Write a review</a></div><div class="price" id="variant-price">${money(selectedVariant.price)}${selectedVariant.regular>selectedVariant.price&&selectedVariant.price>0?`<del>${money(selectedVariant.regular)}</del>`:''}</div><p class="pdp-short">${esc(p.short||p.description).slice(0,320)}</p><div class="colour-detail"><span>Colour: <strong>${esc(p.color)}</strong></span><small>From product title · see photos for detail</small></div><div class="purchase for fabric composition. Ask our team if you need more detail.'],['Wash care','Follow the garment care label. Avoid high heat and wash similar colours together unless the label advises otherwise.'],['Shipping','Delivery depends on product availability and your destination PIN code. Confirm charges and timelines with the live store.'],['Returns & exchange','Contact support to confirm eligibility, deadlines and garment-condition requirements.'],['FAQs','Need help choosing a size, checking availability or understanding delivery? Contact +91 8318595521 or visit our help centre.']].map(([t,d],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><p>${esc(d)}</p>${t==='Shipping'?'<a class="text-link" href="/shipping-policy/">Shipping information</a>':t==='Returns & exchange'?'<a class="text-link" href="/return-policy/">Return information</a>':''}</details>`).join('')}</div></div></div><section class="product-reviews-block reveal"><div class="section-head"><div><div class="eyebrow">HONEST FEEDBACK</div><h2>How did it fit?</h2></div><a class="button" href="/reviews/?product=${p.id}">Write a review</a></div>${reviewList(p.id)}</section>${productSection('You may also like.','More styles from this collection.',products.filter(x=>x.id!==p.id&&x.category===p.category),'/product-category/'+catSlug(p.category)+'/','SIMILAR STYLES',4)}${productSection('Complete your look.','Pair your own favourites. Recommendations are based on category, not sales activity.',products.filter(x=>x.id!==p.id&&x.category!==p.category&&available(x)),'/shop/','WARDROBE PAIRINGS',4)}</div><div class="sticky-purchase" id="sticky-purchase"><img src="${esc(p.image)}" alt="${esc(p.name)}"><div><strong>${esc(p.name)}</strong><span id="sticky-size">Size ${esc(selectedVariant.size)}</span></div><span class="sticky-price" id="sticky-price">${money(selectedVariant.price)}</span><button data-sticky-size class="mobile-only">Size</button><button class="primary" data-sticky-add ${!selectedVariant.stock||!selectedVariant.price?'disabled':''}>Add to bag</button><button data-sticky-buy ${!selectedVariant.stock||!selectedVariant.price?'disabled':''}>Buy now</button></div>`};
function syncProductVariant(){if(!currentProduct||!selectedVariant)return;$('#pdp-stock').textContent=(selectedVariant.stock&&selectedVariant.price?'Available in supplied catalogue':'Ask about availability')+' · SKU '+(selectedVariant.sku||selectedVariant.id);$('#sticky-size').textContent='Size '+selectedVariant.size;$('#sticky-price').textContent=money(selectedVariant.price);$('.product-detail-image').src=selectedVariant.image||currentProduct.image;$('#product-whatsapp').href=wa('Hi Beyond, I need help with '+currentProduct.name+'. Size: '+selectedVariant.size);['#add-cart','#buy-now','[data-sticky-add]','[data-sticky-buy]'].forEach(s=>$(s).disabled=!selectedVariant.stock||!selectedVariant.price)}
function productPhoto(i){if(!currentProduct)return;const images=currentProduct.gallery||[currentProduct.image],index=(i+images.length)%images.length;$('.product-detail-image').src=images[index];document.querySelectorAll('[data-pdp-photo]').forEach(b=>b.classList.toggle('chosen',Number(b.dataset.photoIndex)===index));$('.main-image-button').dataset.galleryIndex=String(index)}
function storeCard(s){return `<article class="store-card ${s.status}" id="store-${s.id}"><span class="status-pill ${s.status}">${storeStatus[s.status][0]}</span><h2>${s.name}</h2><span class="store-city">${s.city}</span><p>${s.address}</p><p class="store-status-note">${storeStatus[s.status][1]}</p><div class="store-actions"><button data-store-map="${s.id}">View on map</button><a class="button" href="${s.maps||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address)}" target="_blank" rel="noopener">Directions</a>${s.phone?`<a class="inline-link" href="tel:+91${s.phone}">Call +91 ${s.phone}</a><a class="inline-link" target="_blank" rel="noopener" href="${wa('Hi Beyond, I would like to ask about '+s.name+' in '+s.city,s.phone)}">WhatsApp store</a>`:''}<a class="inline-link" href="/contact/?topic=store">${s.status==='open'?'Request personal assistance':'Ask for store updates'}</a></div></article>`}
function storesPage(){const requested=new URLSearchParams(routeLocation.search).get('store');let chosen=storeData.find(s=>s.id===requested)||storeData[0];return `<div class="wrap">${heading('Find a Beyond store.','Feel the fabric. Find your fit. Experience Beyond in person.')}<div class="store-toolbar"><label><span>Search city or location</span><input class="search-input" id="store-search" placeholder="Lucknow, Wave Mall, Ashiyana…"></label><label><span>Store status</span><select id="store-status"><option value="">All stores</option><option value="open">Now open</option><option value="closed">Temporarily closed</option><option value="soon">Coming soon</option></select></label><button data-location>Use my location</button></div><p id="location-status" class="muted" role="status">Store statuses and addresses are supplied by Beyond. Call to confirm current hours.</p><div class="locator-layout"><div class="store-list" id="store-list">${storeData.map(storeCard).join('')}</div><div class="locator-map"><iframe id="store-map" title="${esc(chosen.name)} map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(chosen.address)}&output=embed"></iframe><div class="map-store-info" id="map-store-info"><span class="status-pill ${chosen.status}">${storeStatus[chosen.status][0]}</span><h3>${chosen.name} · ${chosen.city}</h3><p>${chosen.address}</p></div><div class="map-location-buttons">${storeData.map(s=>`<button data-store-map="${s.id}">${s.city} · ${s.name}</button>`).join('')}</div></div></div><section></section></div>`}
function filterStores(){let q=$('#store-search').value.toLowerCase(),status=$('#store-status').value;let list=storeData.filter(s=>(s.name+' '+s.city+' '+s.address).toLowerCase().includes(q)&&(!status||s.status===status));$('#store-list').innerHTML=list.length?list.map(storeCard).join(''):'<div class="empty"><h2>No store matches.</h2><p>Try another city or status.</p></div>'}

const oldReviewList=reviewList;
reviewList=function(id){let rs=reviews.filter(r=>!id||r.product===id);return rs.length?rs.map((r,i)=>`<article class="review enhanced-review" data-rating="${r.rating}"><div><strong>${esc(r.name)}</strong><span>${'★'.repeat(Number(r.rating))}</span></div><p>${esc(r.text)}</p><small>Size: ${esc(r.size||'Not specified')} · Fit: ${esc(r.fit||'Not specified')}</small>${r.image?`<img class="review-photo" src="${esc(r.image)}" alt="Customer review photo">`:''}<div class="review-bottom"><small>Unverified preview review · saved on this device</small><button class="inline-link" data-helpful="${reviews.indexOf(r)}">Helpful (${Number(r.helpful)||0})</button></div></article>`).join(''):'<div class="empty review-empty"><h3>Your experience can help someone else.</h3><p>No published reviews are available in this preview. Tell us how the fit felt.</p></div>'};
reviewPage=function(){const product=new URLSearchParams(routeLocation.search).get('product')||'';const rs=reviews.filter(r=>!product||r.product===product);return `<div class="wrap">${heading('Honest feedback. Better fit.','Share your experience and help another shopper find their fit.')}<div class="notice">Reviews here are unverified, device-local previews. Verified purchases and moderation require the live store.</div><div class="split content"><div><div class="rating-breakdown"><div><strong>${rs.length?(rs.reduce((n,r)=>n+Number(r.rating),0)/rs.length).toFixed(1):'—'}</strong><span>${rs.length} preview reviews</span></div><div>${[5,4,3,2,1].map(n=>`<div class="rating-line"><span>${n} ★</span><progress max="${Math.max(1,rs.length)}" value="${rs.filter(r=>Number(r.rating)===n).length}"></progress><span>${rs.filter(r=>Number(r.rating)===n).length}</span></div>`).join('')}</div></div><label class="review-filter">Filter reviews <select id="review-rating-filter"><option value="">All ratings</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${n} stars</option>`).join('')}</select></label><div id="review-list">${reviewList(product||null)}</div></div><form id="lux-review-form" class="panel stack"><h2>How did it fit?</h2>${field('Your name','name','text',true)}<label class="field">Product<select name="product" required><option value="">Choose a product</option>${products.map(p=>`<option value="${p.id}" ${p.id===product?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="form-grid"><label class="field">Rating<select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} stars</option>`).join('')}</select></label><label class="field">Size purchased<input name="size" placeholder="e.g. 3XL"></label></div><label class="field">Fit feedback<select name="fit"><option>True to size</option><option>Smaller than expected</option><option>Larger than expected</option><option>Not sure</option></select></label><label class="field">Your review<textarea name="text" required minlength="10" maxlength="2000"></textarea></label><label class="field">Photo (optional)<input type="file" accept="image/jpeg,image/png,image/webp" name="photo"><small>Saved on this device only. Maximum 2 MB.</small></label><button class="primary">Save preview review</button></form></div></div>`};
function recentPage(){const ps=readLocal('recent',[]).map(id=>products.find(p=>p.id===id)).filter(Boolean);return `<div class="wrap">${heading('Still thinking about it?','Your recently viewed styles, saved on this device.')}<section>${ps.length?`<div class="product-grid">${ps.map(card).join('')}</div><button class="inline-link" data-clear-recent-products>Clear recently viewed</button>`:'<div class="empty"><h2>Your story starts with a style.</h2><a class="button primary" href="/shop/">Explore the collection</a></div>'}</section></div>`}

const baseRender=render;

const originalSchema=updateSchema;

document.addEventListener('change',e=>{const id=e.target.id;const map={'filter-size':'size','sort':'sort','filter-color':'color','filter-stock':'stock','filter-gender':'gender','filter-sale':'sale'};if(map[id]){filters[map[id]]=id==='filter-sale'?e.target.checked:e.target.value;filterRefresh();e.stopImmediatePropagation()}if(id==='store-status')filterStores();if(id==='saved-address'&&e.target.value!==''){let a=readLocal('addresses',[])[Number(e.target.value)];checkoutDraft={...checkoutDraft,...a};restoreCheckout()}if(id==='review-rating-filter'){document.querySelectorAll('[data-rating]').forEach(r=>r.hidden=!!e.target.value&&r.dataset.rating!==e.target.value)}},true);
document.addEventListener('submit',async e=>{const f=e.target,d=new FormData(f);let handled=true;if(f.id==='drawer-coupon'){if(applyPreviewCoupon(d.get('coupon'))){openBag('Your preview coupon is applied.');toast('Coupon applied.')}}else if(f.id==='fit-profile-form'){writeLocal('fit-profile',Object.fromEntries(d));toast('Your fit preferences are saved on this device.')}else if(f.id==='profile-form'){writeLocal('profile',Object.fromEntries(d));closeOverlay();render();selectAccountTab('profile');toast('Shopping profile saved on this device.')}else if(f.id==='address-form'){let as=readLocal('addresses',[]),a=Object.fromEntries(d),i=f.dataset.addressIndex;if(i==='')as.push(a);else as[Number(i)]=a;writeLocal('addresses',as);closeOverlay();render();selectAccountTab('addresses');toast('Address saved on this device.')}else if(f.id==='delivery-check'){let pin=d.get('pin');$('#delivery-result').innerHTML=`<div class="notice">${esc(pin)} is a valid six-digit PIN format. Delivery, charges and COD are not verified.</div><a class="button primary" href="${wa('Hi Beyond, please confirm delivery, shipping charges and COD availability for PIN '+pin+'.') }" target="_blank" rel="noopener">Confirm delivery on WhatsApp</a>`;}else if(f.id==='lux-checkout'){if(checkoutStep!==3){checkoutGo(checkoutStep+1)}else{captureCheckout();const order={id:'DEMO-'+Date.now().toString().slice(-9),date:new Date().toISOString(),customer:{...checkoutDraft},total:totals().total,items:cartItems().map(x=>({productId:x.p.id,name:x.p.name,size:x.v.size,qty:x.qty,price:x.v.price}))};const orders=readLocal('orders',[]);writeLocal('orders',[order,...orders]);if(d.get('saveAddress')){const as=readLocal('addresses',[]);let a=Object.fromEntries(['first','last','email','phone','address','city','state','pin'].map(k=>[k,checkoutDraft[k]||'']));if(!as.some(x=>x.address===a.address&&x.pin===a.pin))writeLocal('addresses',[...as,a])}cart=[];coupon='';save();checkoutStep=0;localStorage.removeItem('beyond-checkout-draft');checkoutDraft={};routeHistory.pushState({},'','/order-confirmation/?order='+order.id);render();scrollTo(0,0);track('demo_order_complete',{value:order.total,currency:'INR'})}}else if(f.id==='support-form'){let text='Hi Beyond, I need help.\n'+[...d.entries()].map(([k,v])=>k+': '+v).join('\n');$('#support-ready').innerHTML=`<a class="button primary" href="${wa(text)}" target="_blank" rel="noopener">Open WhatsApp with your enquiry</a><p>Your message is ready. Send it in WhatsApp to contact Beyond.</p>`;}else if(f.id==='track-form'){trackingResult(d.get('order'))}else if(f.id==='lux-review-form'){const file=d.get('photo');if(file?.size>2*1024*1024){toast('Choose a photo under 2 MB.');e.preventDefault();e.stopImmediatePropagation();return}let r={product:d.get('product'),name:d.get('name'),rating:Number(d.get('rating')),text:d.get('text'),size:d.get('size'),fit:d.get('fit'),helpful:0};e.preventDefault();e.stopImmediatePropagation();if(file?.size&&['image/jpeg','image/png','image/webp'].includes(file.type)){r.image=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)})}try{reviews.push(r);writeLocal('reviews',reviews);render();toast('Unverified review saved on this device.')}catch{reviews.pop();toast('Device storage is full. Try a smaller photo.')}return}else if(f.id==='newsletter'){writeLocal('newsletter-interest',{email:d.get('email')||$('#news-email').value,date:new Date().toISOString()});toast('Your interest is saved on this device. Live email subscription will connect at launch.');f.reset()}else handled=false;if(handled){e.preventDefault();e.stopImmediatePropagation()}},true);

document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!document.body.classList.contains('filters-open'))return;const panel=$('#filter-panel');const xs=[...panel.querySelectorAll('button,input,select,a')].filter(x=>!x.disabled&&x.offsetParent!==null);const first=xs[0],last=xs.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===panel)){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}});
